server {
    listen 80;
    client_max_body_size 500m;   # большие PDF

    root /usr/share/nginx/html;
    index index.html;

    location /api/ingest/ {
        proxy_pass http://ingest:8000/;
        proxy_read_timeout 600s;
    }

    # адрес пользователя — для журнала входов
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/auth/ {
        proxy_pass http://ingest:8000/auth/;
    }

    location /api/admin/ {
        proxy_pass http://ingest:8000/admin/;
        proxy_read_timeout 600s;
    }

    location /api/analysis/ {
        proxy_pass http://ingest:8000/analysis/;
        proxy_buffering off;         # анализ рисков идёт потоком
        proxy_read_timeout 1800s;
    }

    location /api/chat/ {
        proxy_pass http://chat:8000/;
        proxy_buffering off;         # ответ модели идёт потоком, по словам
        proxy_read_timeout 600s;
    }
}
