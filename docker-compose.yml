# DocSearch — серверный вариант в контейнерах (Linux-сервер, Windows, демо «как у начальника»).
# Для MacBook удобнее и быстрее настольное приложение: ./install.sh  (см. README).
#
# Запуск:  docker compose up -d --build     → http://localhost:8080
#
#   web     — веб-интерфейс (nginx)
#   ingest  — вход и пользователи; чтение документов, нарезка на чанки, эмбеддинги, запись в базу;
#             анализ: связи документов, сводная редакция договора, сравнение, реестр рисков;
#             администрирование: журнал входов, логи, консоль
#   chat    — поиск по базе (косинусная близость) и ответ нейросети
#   qdrant  — векторная база данных
#   ollama  — локальные нейросети: LLM + модель эмбеддингов
#   models  — одноразовый: скачивает модели в ollama и завершается

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment:
    QDRANT_URL: http://qdrant:6333
    OLLAMA_URL: http://ollama:11434
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    STORAGE_DIR: /data/files
    INBOX_DIR: /data/inbox
    AUTH_DIR: /data/auth
    LOG_DIR: /data/logs
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  depends_on:
    - qdrant
    - ollama

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ingest
      - chat

  ingest:
    <<: *backend
    command: ["uvicorn", "app.ingest_api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - ./data/files:/data/files
      - ./data/inbox:/data/inbox
      - ./data/auth:/data/auth
      - ./data/logs:/data/logs

  chat:
    <<: *backend
    command: ["uvicorn", "app.chat_api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - ./data/auth:/data/auth     # проверка входа: те же пользователи и ключ сессий
      - ./data/logs:/data/logs

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ./data/qdrant:/qdrant/storage

  ollama:
    image: ollama/ollama:0.40.12
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama

  models:
    image: ollama/ollama:0.40.12
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "жду ollama..."; sleep 2; done
        for m in "${EMBED_MODEL:-bge-m3}" "${LLM_MODEL:-qwen2.5:3b}"; do
          echo "== модель $$m =="; ollama pull "$$m" || exit 1
        done
        echo "Все модели готовы."
